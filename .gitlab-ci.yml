stages:
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE:mm
  DEPLOY_HOST: mm.almaz-rpe.ru
  DEPLOY_PATH: /opt/mattermost

build:
  stage: build
  image: nexus.almaz-rpe.ru/podman/stable:latest
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      podman build
      -t $IMAGE_NAME:$CI_COMMIT_SHA
      -t $IMAGE_NAME:latest
      -f $CI_PROJECT_DIR/Containerfile
      $CI_PROJECT_DIR
      --build-arg BUILDKIT_INLINE_CACHE=1
    - podman push $IMAGE_NAME:$CI_COMMIT_SHA
    - podman push $IMAGE_NAME:latest
    - podman create --name mm-extract $IMAGE_NAME:$CI_COMMIT_SHA
    - podman cp mm-extract:/mattermost.tar.gz ./mattermost.tar.gz
    - podman rm mm-extract
  artifacts:
    paths:
      - mattermost.tar.gz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client sshpass
  script:
    - echo "Deploying to $DEPLOY_HOST..."
    - sshpass -p "$DEPLOY_PASSWORD" scp -o StrictHostKeyChecking=no ./mattermost.tar.gz root@$DEPLOY_HOST:$DEPLOY_PATH/mattermost.tar.gz
    - |
      sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST << 'EOF'
        set -e
        cd $DEPLOY_PATH
        echo "Stopping Mattermost..."
        systemctl stop mattermost || true
        echo "Extracting new version..."
        rm -rf mattermost
        tar -xzf mattermost.tar.gz
        echo "Starting Mattermost..."
        systemctl start mattermost
        echo "Deployment complete!"
      EOF
  environment:
    name: production
    url: https://mm.almaz-rpe.ru
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
