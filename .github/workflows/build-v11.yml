name: Build v11

on:
  push:
    branches: [deploy]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-v11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Mattermost v11
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: custardpy/mattermost:v11.11.3
          cache-from: type=gha,scope=mattermost-v11
          cache-to: type=local,dest=out,mode=max

      - name: Export build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-v11-build
          path: out/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mattermost-v11-build
          path: out/

      - name: Unpack and verify
        run: |
          mkdir -p extracted
          tar -xzf out/mattermost.tar.gz -C extracted
          ./extracted/mattermost/bin/mattermost version

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v11.11.3-build.${{ github.run_number }}
          name: Mattermost v11.11.3 Build ${{ github.run_number }}
          body: |
            Built on ${{ github.event.head_commit.timestamp }}
            Version: 11.11.3
            Build Number: ${{ github.run_number }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: out/mattermost.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
