name: Build Mattermost

on:
  push:
    branches:
      - deploy
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Mattermost Tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.mm-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read Mattermost version
        id: mm-version
        run: |
          version="$(sed -nE 's/^[[:space:]]*ARG[[:space:]]+MATTERMOST_VERSION=([^[:space:]#]+).*$/\1/p' Containerfile)"
          if [ -z "$version" ]; then
            echo "::error file=Containerfile::could not read ARG MATTERMOST_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Mattermost version: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uncached on purpose: exporting to the GHA cache cost ~4m25s per run and
      # could never be reused, because BUILD_NUMBER changes on every run.
      - name: Build Mattermost
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: package
          platforms: linux/amd64
          outputs: type=local,dest=out
          build-args: |
            MATTERMOST_VERSION=${{ steps.mm-version.outputs.version }}
            BUILD_NUMBER=${{ steps.mm-version.outputs.version }}-build.${{ github.run_number }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mattermost-tarball
          path: out/mattermost.tar.gz
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/deploy' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: mattermost-tarball

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}-build.${{ github.run_number }}
          name: "Mattermost ${{ needs.build.outputs.version }} build #${{ github.run_number }}"
          files: mattermost.tar.gz
          generate_release_notes: true
          make_latest: true
