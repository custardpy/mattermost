name: Build Mattermost

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build:
    name: Build Mattermost Tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Mattermost
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          target: builder
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          tags: mm-build:latest

      - name: Extract tarball
        run: |
          CONTAINER_ID=$(docker create mm-build:latest)
          docker cp $CONTAINER_ID:/work/mattermost/server/dist/mattermost-team-linux-amd64.tar.gz ./mattermost.tar.gz
          docker rm $CONTAINER_ID

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-tarball
          path: mattermost.tar.gz
          retention-days: 7
          if-no-files-found: error
