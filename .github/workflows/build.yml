name: Build Mattermost

on:
  push:
    branches:
      - deploy
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Mattermost Tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.mm-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read Mattermost version
        id: mm-version
        run: |
          version="$(sed -nE 's/^ARG MATTERMOST_VERSION=([^[:space:]]+)$/\1/p' Containerfile)"
          if [ -z "$version" ]; then
            echo "::error file=Containerfile::could not read ARG MATTERMOST_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Mattermost version: $version"

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h

          # Remove large unused packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Remove Docker data
          sudo docker system prune -af
          sudo docker builder prune -af
          
          # Remove Android SDK (saves ~3GB)
          sudo rm -rf /usr/local/lib/android
          
          # Remove CodeQL bundles (saves ~2GB)
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          # Remove large apt packages
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          # Remove cached package managers
          sudo rm -rf /var/cache/apt/archives
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "=== After cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Mattermost
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: builder
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          build-args: MATTERMOST_VERSION=${{ steps.mm-version.outputs.version }}
          tags: mm-build:latest

      - name: Extract tarball
        run: |
          CONTAINER_ID=$(docker create mm-build:latest)
          docker cp $CONTAINER_ID:/work/mattermost/server/dist/mattermost-team-linux-amd64.tar.gz ./mattermost.tar.gz
          docker rm $CONTAINER_ID

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mattermost-tarball
          path: mattermost.tar.gz
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: github.ref == 'refs/heads/deploy' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: mattermost-tarball

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}-build.${{ github.run_number }}
          name: "Mattermost ${{ needs.build.outputs.version }} build #${{ github.run_number }}"
          files: mattermost.tar.gz
          generate_release_notes: true
          make_latest: true
